<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock Terrain</title>

<style>
@media print {
    /* Masquer tout le superflu */
    body * {
        visibility: hidden;
    }
    /* Rendre visible uniquement l'onglet Pelican et son contenu */
    #ongletPelican, #ongletPelican * {
        visibility: visible;
    }
    #ongletPelican {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        margin: 0;
        padding: 0;
    }
    /* Masquer les champs de recherche et boutons interactifs superflus sur le PDF */
    #inputPlan, #listePlanResultats, button {
        display: none !important;
    }
}
</style>
</head>
<body>
<div id="loaderGlobal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.4s ease;">
    <h2 style="font-family: sans-serif; color: #0056b3; font-size: 18px; margin-bottom: 15px;">Chargement des données...</h2>
    <!-- Barre de progression style ascenseur -->
    <div style="width: 220px; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; border: 1px solid #ced4da;">
        <div id="barreProgression" style="width: 30%; height: 100%; background: #0056b3; transition: width 0.3s ease;"></div>
    </div>
</div>

    <div style="padding: 15px; max-width: 600px; margin: auto; font-family: sans-serif;">
        
        <!-- BANDEAU DE VERSION -->
        <div id="bandeauVersion" style="background: #0056b3; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 15px; border-radius: 4px;">Mode Ensemble Actif</div>

        <!-- ONGLETS DE NAVIGATION -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button type="button" onclick="changerOnglet('pelican')" id="btnTabPelican" style="flex: 1; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">📦 Ensemble (Eclaté)</button>
            <button type="button" onclick="changerOnglet('json')" id="btnTabJson" style="flex: 1; padding: 12px; background: #e9ecef; color: #333; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">🔍 SY (JSON)</button>
        </div>

        <!-- ONGLET 1 : PELICAN (Ensembles) -->
        <div id="ongletPelican" style="display: block;">
            <div style="background: #f1f3f5; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ced4da;">
                <div style="position: relative;">
                    <label style="display: block; font-weight: bold; font-size: 13px; color: #333; margin-bottom: 4px;">🔍 Recherche ENSEMBLE (Plan / Repère) :</label>
                    <input type="text" id="inputPlan" inputmode="numeric" placeholder="Ex: 12345..." style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    <div id="listePlanResultats" style="position: absolute; left: 0; right: 0; z-index: 1000;"></div>
                </div>
            </div>

            <!-- ZONE DE RÉSULTAT / FICHE PELICAN -->
            <div id="resultat" style="display: none; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px;">
                <div style="text-align: center; margin-bottom: 15px;">
                    <span id="resPlan" style="background: #0056b3; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px;"></span>
                    <span id="resRep" style="background: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-left: 5px;"></span>
                    <p id="resIntitule" style="font-weight: bold; font-size: 15px; margin: 10px 0 0 0; color: #222;"></p>
                </div>

                <div style="text-align: center; margin-bottom: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 10px;">
                    <img id="imgPiece" src="" style="max-width: 100%; height: 200px; object-fit: contain;" alt="Miniature">
                </div>

                <div id="infoStockActuel" style="margin-bottom: 15px;"></div>
                <div id="resSymbole"></div>
            </div>
        </div>

        <!-- ONGLET 2 : JSON / SYMBOLES -->
        <div id="ongletJson" style="display: none;">
            <div style="background: #f1f3f5; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ced4da;">
                <div style="position: relative;">
                    <label style="display: block; font-weight: bold; font-size: 13px; color: #0056b3; margin-bottom: 4px;">🔍 Recherche SY / SYMBOLE :</label>
                    <input type="text" id="inputSymboleJson" inputmode="numeric" placeholder="Ex: bob..." style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    <div id="suggestionsJson" style="position: absolute; left: 0; right: 0; z-index: 1000;"></div>
                </div>
            </div>

            <!-- ZONE DE RÉSULTAT / FICHE JSON -->
            <div id="resultatJson" style="display: none; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px;">
                <div style="text-align: center; margin-bottom: 15px;">
                    <span id="resPlanJson" style="background: #0056b3; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px;"></span>
                    <span id="resRepJson" style="background: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-left: 5px;"></span>
                    <p id="resIntituleJson" style="font-weight: bold; font-size: 15px; margin: 10px 0 0 0; color: #222;"></p>
                </div>

                <div style="text-align: center; margin-bottom: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 10px;">
                    <img id="imgPieceJson" src="" style="max-width: 100%; height: 200px; object-fit: contain;" alt="Miniature Symbole">
                </div>

                <div id="infoStockActuelJson" style="margin-bottom: 15px;"></div>
            </div>
        </div>

        <!-- BOUTONS ACTIONS GLOBALES -->
        <div style="margin-top: 15px; display: flex; gap: 10px;">
            <button type="button" onclick="partagerStock()" style="background: #17a2b8; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">📤 Partager le Stock</button>
            <button type="button" onclick="imprimerFichePelican()" style="background: #dc3545; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold;">🖨️ Imprimer / PDF Éclaté & Miniatures</button>
            <button type="button" id="btnInstaller" style="background: #ffc107; color: #212529; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; display: none; font-weight: bold; flex: 1;">📱 Installer l'app</button>
        </div>

    </div>

    <!-- MODALE STOCK (PELICAN) -->
    <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h3 id="modalTitre" style="margin-top: 0; color: #0056b3; font-size: 16px;"></h3>
            <p id="modalSousTitre" style="font-size: 12px; color: #666; margin-bottom: 15px;"></p>
            
            <div id="divTypeMvt" style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Type de mouvement :</label>
                <select id="mouvementType" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="ENTREE">➕ Entrée / Ajout</option>
                    <option value="SORTIE">➖ Sortie / Retrait</option>
                </select>
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Site :</label>
                <input type="text" id="stockSite" inputmode="numeric" placeholder="Ex: 1..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Bâtiment :</label>
                <input type="text" id="stockBatiment" inputmode="numeric" placeholder="Ex: 2..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Rang / Étagère :</label>
                <input type="text" id="stockRang" inputmode="numeric" placeholder="Ex: 3..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Quantité :</label>
                <input type="number" id="stockQuantite" value="1" min="1" inputmode="numeric" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="validerMouvementStock()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1; font-weight: bold;">Valider</button>
                <button type="button" onclick="fermerModal()" style="background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- MODALE STOCK (JSON) -->
    <div id="modalOverlayJson" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h3 id="modalTitreJson" style="margin-top: 0; color: #0056b3; font-size: 16px;"></h3>
            <p id="modalSousTitreJson" style="font-size: 12px; color: #666; margin-bottom: 15px;"></p>
            
            <input type="hidden" id="mouvementTypeJson" value="ENTREE">

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Site :</label>
                <input type="text" id="stockSiteJson" inputmode="numeric" placeholder="Ex: 1..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Bâtiment :</label>
                <input type="text" id="stockBatimentJson" inputmode="numeric" placeholder="Ex: 2..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Rang / Étagère :</label>
                <input type="text" id="stockRangJson" inputmode="numeric" placeholder="Ex: 3..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Quantité :</label>
                <input type="number" id="stockQuantiteJson" value="1" min="1" inputmode="numeric" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="validerMouvementStockJson()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1; font-weight: bold;">Valider</button>
                <button type="button" onclick="fermerModalJson()" style="background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS REQUIS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="pelican.js"></script>
    <script src="json_mode.js"></script>

    <!-- SCRIPT DE BASCULE DES ONGLETS -->
    <script>
        function changerOnglet(nomOnglet) {
            let ongletPelican = document.getElementById('ongletPelican');
            let ongletJson = document.getElementById('ongletJson');
            let btnPelican = document.getElementById('btnTabPelican');
            let btnJson = document.getElementById('btnTabJson');
            let bandeau = document.getElementById('bandeauVersion');

            if (nomOnglet === 'pelican') {
                ongletPelican.style.display = 'block';
                ongletJson.style.display = 'none';
                btnPelican.style.background = '#0056b3';
                btnPelican.style.color = 'white';
                btnJson.style.background = '#e9ecef';
                btnJson.style.color = '#333';
                bandeau.style.background = '#0056b3';
                bandeau.textContent = 'Mode Ensemble Actif';
            } else {
                ongletPelican.style.display = 'none';
                ongletJson.style.display = 'block';
                btnJson.style.background = '#0056b3';
                btnJson.style.color = 'white';
                btnPelican.style.background = '#e9ecef';
                btnPelican.style.color = '#333';
                bandeau.style.background = '#28a745';
                bandeau.textContent = 'Mode SY (JSON) Actif';
            }
        }
        async function partagerStock() {
    let stockData = localStorage.getItem('stock_local_sauvegarde') || '[]';
    let blob = new Blob([stockData], { type: 'application/json' });
    let file = new File([blob], 'stock_terrain.json', { type: 'application/json' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
            await navigator.share({
                title: 'Gestion Stock Terrain',
                text: 'Voici le fichier de sauvegarde du stock terrain.',
                files: [file]
            });
            return;
        } catch (error) {
            if (error.name !== 'AbortError') {
                console.warn("Erreur de partage, bascule vers le téléchargement :", error);
            } else {
                return; // L'utilisateur a annulé le partage
            }
        }
    }

    // Solution de secours si le partage natif n'est pas disponible
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'stock_terrain.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}
    </script>
</body>
</html>
