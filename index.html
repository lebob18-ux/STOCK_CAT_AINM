<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Stock Terrain</title>

    <!-- ================================================================= -->
    <!-- SECTION : STYLES CSS ET RÈGLES D'IMPRESSION                        -->
    <!-- ================================================================= -->
    <style>
    @media print {
        body * { visibility: hidden; }
        #ongletPelican, #ongletPelican * { visibility: visible; }
        #ongletPelican { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; }
        #inputPlan, #listePlanResultats, button { display: none !important; }
    }
    </style>
</head>
<body>
<!-- ÉCRAN DE VERROUILLAGE / DEMANDE D'ACCÈS -->
<div id="auth-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 8px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
        <h2 style="margin-top: 0; color: #333;">Accès à l'application</h2>
        <p id="auth-message" style="color: #666; font-size: 14px; margin-bottom: 20px;">Veuillez renseigner vos informations pour demander l'accès BOB.</p>
        
        <!-- Formulaire de demande -->
        <div id="form-demande">
            <input type="text" id="req-prenom" placeholder="Votre Prénom" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"><br>
            <input type="text" id="req-nom" placeholder="Votre Nom" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"><br>
            <input type="email" id="req-email" placeholder="Votre Email professionnel" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;"><br>
            <button onclick="envoyerDemandeAcces()" style="background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">Demander l'accès</button>
        </div>

        <!-- Message si déjà demandé mais en attente -->
        <div id="attente-validation" style="display: none;">
            <p style="color: #d9534f; font-weight: bold; margin-bottom: 10px;">Votre demande est en cours de validation par l'administrateur.</p>
            <p style="font-size: 13px; color: #666; margin-bottom: 15px;">Revenez plus tard et cliquez sur le bouton ci-dessous pour vérifier.</p>
            <button onclick="verifierAcces()" style="background: #6c757d; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%;">Vérifier si validé</button>
        </div>
    </div>
</div>
    <!-- ================================================================= -->
    <!-- SECTION : LOADER GLOBAL DE CHARGEMENT                             -->
    <!-- ================================================================= -->
    <div id="loaderGlobal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.4s ease;">
        <h2 style="font-family: sans-serif; color: #0056b3; font-size: 18px; margin-bottom: 15px;">Chargement des données...</h2>
        <div style="width: 220px; height: 8px; background: #e9ecef; border-radius: 4px; overflow: hidden; border: 1px solid #ced4da;">
            <div id="barreProgression" style="width: 30%; height: 100%; background: #0056b3; transition: width 0.3s ease;"></div>
        </div>
    </div>

    <div style="padding: 15px; max-width: 600px; margin: auto; font-family: sans-serif;">
        
        <!-- ================================================================= -->
        <!-- SECTION : BANDEAU DE VERSION & ONGLETS DE NAVIGATION              -->
        <!-- ================================================================= -->
        <div id="bandeauVersion" style="background: #0056b3; color: white; padding: 6px 12px; font-size: 13px; font-weight: bold; text-align: center; margin-bottom: 15px; border-radius: 4px;">Mode Ensemble Actif</div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button type="button" onclick="changerOnglet('pelican')" id="btnTabPelican" style="flex: 1; padding: 12px; background: #0056b3; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">📦 Ensemble (Eclaté)</button>
            <button type="button" onclick="changerOnglet('json')" id="btnTabJson" style="flex: 1; padding: 12px; background: #e9ecef; color: #333; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">🔍 SY (JSON)</button>
        </div>

        <!-- ================================================================= -->
        <!-- SECTION : ONGLET 1 - PELICAN (ENSEMBLES)                          -->
        <!-- ================================================================= -->
        <div id="ongletPelican" style="display: block;">
            <div style="background: #f1f3f5; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ced4da;">
                <div style="position: relative;">
                    <label style="display: block; font-weight: bold; font-size: 13px; color: #333; margin-bottom: 4px;">🔍 Recherche ENSEMBLE (Plan / Repère) :</label>
                    <input type="text" id="inputPlan" inputmode="numeric" placeholder="Ex: 12345..." style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    <div id="listePlanResultats" style="position: absolute; left: 0; right: 0; z-index: 1000;"></div>
                </div>
            </div>

            <div id="resultat" style="display: none; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px;">
                <div style="text-align: center; margin-bottom: 15px;">
                    <span id="resPlan" style="background: #0056b3; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px;"></span>
                    <span id="resRep" style="background: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-left: 5px;"></span>
                    <p id="resIntitule" style="font-weight: bold; font-size: 15px; margin: 10px 0 0 0; color: #222;"></p>
                </div>

                <div style="text-align: center; margin-bottom: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 10px;">
                    <img id="imgPiece" src="" style="max-width: 100%; height: 200px; object-fit: contain;" alt="Miniature">
                </div>

                <div id="infoStockActuel" style="margin-bottom: 15px;"></div>
                <div id="resSymbole"></div>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- SECTION : ONGLET 2 - JSON / SYMBOLES (SY)                         -->
        <!-- ================================================================= -->
        <div id="ongletJson" style="display: none;">
            <div style="background: #f1f3f5; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ced4da;">
                <div style="position: relative;">
                    <label style="display: block; font-weight: bold; font-size: 13px; color: #0056b3; margin-bottom: 4px;">🔍 Recherche SY / SYMBOLE :</label>
                    <input type="text" id="inputSymboleJson" inputmode="numeric" placeholder="Ex: bob..." style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
                    <div id="suggestionsJson" style="position: absolute; left: 0; right: 0; z-index: 1000;"></div>
                </div>
            </div>

            <div id="resultatJson" style="display: none; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 15px;">
                <div style="text-align: center; margin-bottom: 15px;">
                    <span id="resPlanJson" style="background: #0056b3; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px;"></span>
                    <span id="resRepJson" style="background: #6c757d; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; margin-left: 5px;"></span>
                    <p id="resIntituleJson" style="font-weight: bold; font-size: 15px; margin: 10px 0 0 0; color: #222;"></p>
                </div>

                <div style="text-align: center; margin-bottom: 15px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 10px;">
                    <img id="imgPieceJson" src="" style="max-width: 100%; height: 200px; object-fit: contain;" alt="Miniature Symbole">
                </div>

                <div id="infoStockActuelJson" style="margin-bottom: 15px;"></div>
            </div>
        </div>

        <!-- ================================================================= -->
        <!-- SECTION : BOUTONS D'ACTIONS GLOBALES                              -->
        <!-- ================================================================= -->
        <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
            <button type="button" onclick="partagerStock()" style="background: #17a2b8; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">📤 Partager le Stock</button>
            <button type="button" onclick="imprimerFichePelican()" style="background: #dc3545; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; width: 100%; margin-top: 5px; font-weight: bold;">🖨️ Imprimer / PDF Éclaté & Miniatures</button>
            <button type="button" id="btnInstaller" style="background: #ffc107; color: #212529; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; display: none; font-weight: bold; flex: 1;">📱 Installer l'app</button>
        </div>

    </div>

    <!-- ================================================================= -->
    <!-- SECTION : MODALE DE GESTION DES STOCKS (PELICAN)                  -->
    <!-- ================================================================= -->
    <div id="modalOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h3 id="modalTitre" style="margin-top: 0; color: #0056b3; font-size: 16px;"></h3>
            <p id="modalSousTitre" style="font-size: 12px; color: #666; margin-bottom: 15px;"></p>
            
            <div id="divTypeMvt" style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Type de mouvement :</label>
                <select id="mouvementType" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="ENTREE">➕ Entrée / Ajout</option>
                    <option value="SORTIE">➖ Sortie / Retrait</option>
                </select>
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Site :</label>
                <input type="text" id="stockSite" inputmode="numeric" placeholder="Ex: 1..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Bâtiment :</label>
                <input type="text" id="stockBatiment" inputmode="numeric" placeholder="Ex: 2..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Rang / Étagère :</label>
                <input type="text" id="stockRang" inputmode="numeric" placeholder="Ex: 3..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Quantité :</label>
                <input type="number" id="stockQuantite" value="1" min="1" inputmode="numeric" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="validerMouvementStock()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1; font-weight: bold;">Valider</button>
                <button type="button" onclick="fermerModal()" style="background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- SECTION : MODALE DE GESTION DES STOCKS (JSON / SY)                -->
    <!-- ================================================================= -->
    <div id="modalOverlayJson" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 99999;">
        <div style="background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
            <h3 id="modalTitreJson" style="margin-top: 0; color: #0056b3; font-size: 16px;"></h3>
            <p id="modalSousTitreJson" style="font-size: 12px; color: #666; margin-bottom: 15px;"></p>
            
            <input type="hidden" id="mouvementTypeJson" value="ENTREE">

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Site :</label>
                <input type="text" id="stockSiteJson" inputmode="numeric" placeholder="Ex: 1..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Bâtiment :</label>
                <input type="text" id="stockBatimentJson" inputmode="numeric" placeholder="Ex: 2..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 10px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Rang / Étagère :</label>
                <input type="text" id="stockRangJson" inputmode="numeric" placeholder="Ex: 3..." style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px;">Quantité :</label>
                <input type="number" id="stockQuantiteJson" value="1" min="1" inputmode="numeric" style="width: 100%; padding: 8px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="button" onclick="validerMouvementStockJson()" style="background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1; font-weight: bold;">Valider</button>
                <button type="button" onclick="fermerModalJson()" style="background: #6c757d; color: white; border: none; padding: 10px; border-radius: 4px; font-size: 13px; cursor: pointer; flex: 1;">Annuler</button>
            </div>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- SECTION : SCRIPTS JAVASCRIPT ET FONCTIONS MÉTIER ISOLÉES          -->
    <!-- ================================================================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="auth.js"></script>
    <script src="pelican.js"></script>

    <script>
        /* ---------------------------------------------------- */
        /* Fonction 1 : Gestion du basculement entre les onglets */
        /* ---------------------------------------------------- */
        function changerOnglet(nomOnglet) {
            let ongletPelican = document.getElementById('ongletPelican');
            let ongletJson = document.getElementById('ongletJson');
            let btnPelican = document.getElementById('btnTabPelican');
            let btnJson = document.getElementById('btnTabJson');
            let bandeau = document.getElementById('bandeauVersion');

            if (nomOnglet === 'pelican') {
                ongletPelican.style.display = 'block';
                ongletJson.style.display = 'none';
                btnPelican.style.background = '#0056b3';
                btnPelican.style.color = 'white';
                btnJson.style.background = '#e9ecef';
                btnJson.style.color = '#333';
                bandeau.style.background = '#0056b3';
                bandeau.textContent = 'Mode Ensemble Actif';
            } else {
                ongletPelican.style.display = 'none';
                ongletJson.style.display = 'block';
                btnJson.style.background = '#0056b3';
                btnJson.style.color = 'white';
                btnPelican.style.background = '#e9ecef';
                btnPelican.style.color = '#333';
                bandeau.style.background = '#28a745';
                bandeau.textContent = 'Mode SY (JSON) Actif';
            }
        }

        /* ---------------------------------------------------- */
        /* Fonction 2 : Partage ou téléchargement du fichier JSON */
        /* ---------------------------------------------------- */
        async function partagerStock() {
            let stockData = localStorage.getItem('stock_local_sauvegarde') || '[]';
            let blob = new Blob([stockData], { type: 'application/json' });
            let file = new File([blob], 'stock_terrain.json', { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: 'Gestion Stock Terrain',
                        text: 'Voici le fichier de sauvegarde du stock terrain.',
                        files: [file]
                    });
                    return;
                } catch (error) {
                    if (error.name !== 'AbortError') {
                        console.warn("Erreur de partage, bascule vers le téléchargement :", error);
                    } else {
                        return;
                    }
                }
            }

            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = 'stock_terrain.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        /* ---------------------------------------------------- */
        /* Fonction 3 : Initialisation des écouteurs d'événements */
        /* ---------------------------------------------------- */
        let articleJsonCourant = null;

        document.addEventListener('DOMContentLoaded', () => {
            let inputSymbole = document.getElementById('inputSymboleJson');
            if (inputSymbole) {
                inputSymbole.addEventListener('input', () => {
                    afficherSuggestionsJson();
                });
            }
        });

        /* ---------------------------------------------------- */
        /* Fonction 4 : Affichage dynamique des suggestions SY  */
        /* ---------------------------------------------------- */
        function afficherSuggestionsJson() {
            let container = document.getElementById('suggestionsJson');
            if (!container) return;
            container.innerHTML = '';
            let val = document.getElementById('inputSymboleJson').value.toLowerCase().trim();
            if (!val) return;

            let matches = cataloguePlanGlobal.filter(item => {
                let sy = String(item.symbole || "").toLowerCase().trim();
                let des = String(item.designation || "").toLowerCase().trim();
                let p = String(item.plan || "").toLowerCase().trim();
                return sy.includes(val) || des.includes(val) || p.includes(val);
            });

            let uniques = [...new Map(matches.map(item => [item.symbole || item.plan, item])).values()].slice(0, 10);
            if (uniques.length === 0) {
                container.innerHTML = '<div style="padding: 10px; color: #777; font-size: 13px; background: white; border: 1px solid #ddd; border-radius: 4px;">Aucun symbole SY trouvé</div>';
                return;
            }

            let wrapper = document.createElement('div');
            wrapper.style.cssText = "background: white; border: 1px solid #ccc; border-radius: 4px; max-height: 280px; overflow-y: auto; position: absolute; z-index: 1000; left: 0; right: 0; box-shadow: 0 4px 8px rgba(0,0,0,0.15);";

            uniques.forEach(article => {
                let div = document.createElement('div');
                div.style.cssText = "padding: 8px 10px; border-bottom: 1px solid #eee; cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 10px;";
                
                let thumbId = 'thumb_sug_' + Math.random().toString(36).substr(2, 5);
                div.innerHTML = `
                    <div id="${thumbId}" style="width: 40px; height: 40px; background: #f1f3f5; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden;">
                        <span style="font-size: 9px; color: #aaa;">Img</span>
                    </div>
                    <div style="flex: 1; overflow: hidden;">
                        <strong>SY : ${article.symbole || 'N/A'}</strong> | Plan : ${article.plan}<br>
                        <small style="color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;">${article.designation || article.intitule || ''}</small>
                    </div>`;

                if (window.supabaseClient && article.symbole) {
                    let symbolePropre = String(article.symbole).trim();
                    window.supabaseClient.storage.from('MIGNATURE_K1').createSignedUrl(`${symbolePropre}.jpg`, 60)
                        .then(({ data }) => {
                            let boxImg = document.getElementById(thumbId);
                            if (data && data.signedUrl && boxImg) {
                                boxImg.innerHTML = `<img src="${data.signedUrl}" style="width: 100%; height: 100%; object-fit: contain;">`;
                            }
                        });
                }

                div.addEventListener('click', () => {
                    document.getElementById('inputSymboleJson').value = article.symbole || article.plan;
                    container.innerHTML = '';
                    afficherFicheJson(article);
                });
                wrapper.appendChild(div);
            });
            container.appendChild(wrapper);
        }

        /* ---------------------------------------------------- */
        /* Fonction 5 : Affichage de la fiche article SY (JSON) */
        /* ---------------------------------------------------- */
        function afficherFicheJson(article) {
            articleJsonCourant = article;
            document.getElementById('resPlanJson').textContent = "Plan: " + (article.plan || '-');
            document.getElementById('resRepJson').textContent = "SY: " + (article.symbole || '-');
            document.getElementById('resIntituleJson').textContent = article.designation || article.intitule || '-';

            let img = document.getElementById('imgPieceJson');
            let defaut = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22200%22%3E%3Crect width=%22320%22 height=%22200%22 fill=%22%23eee%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%23aaa%22%3EChargement miniature...%3C/text%3E%3C/svg%3E';
            img.src = defaut;

            if (window.supabaseClient && article.symbole) {
                let symbolePropre = String(article.symbole).trim();
                window.supabaseClient.storage.from('MIGNATURE_K1').createSignedUrl(`${symbolePropre}.jpg`, 60)
                    .then(({ data }) => {
                        if (data && data.signedUrl && articleJsonCourant.symbole === article.symbole) {
                            img.src = data.signedUrl;
                        } else {
                            img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22200%22%3E%3Crect width=%22320%22 height=%22200%22 fill=%22%23eee%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%23aaa%22%3EImage introuvable%3C/text%3E%3C/svg%3E';
                        }
                    })
                    .catch(() => {
                        img.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22320%22 height=%22200%22%3E%3Crect width=%22320%22 height=%22200%22 fill=%22%23eee%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2214%22 fill=%22%23aaa%22%3EImage introuvable%3C/text%3E%3C/svg%3E';
                    });
            }

            let existants = stockGlobal.filter(s => 
                String(s.plan || "").trim() === String(article.plan || "").trim() &&
                String(s.symbole || "").trim().toLowerCase() === String(article.symbole || "").trim().toLowerCase()
            );

            let divStock = document.getElementById('infoStockActuelJson');
            divStock.style.display = 'block';
            let html = `<div style="background: #f8f9fa; border: 1px solid #ccc; padding: 10px; border-radius: 6px;">`;
            html += `<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <strong style="font-size: 13px; color: #0056b3;">📦 Emplacements Stock SY :</strong>
                        <button type="button" onclick="ouvrirModalStockJson(null)" style="background: #28a745; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer;">➕ Ajouter Stock</button>
                      </div>`;

            if (existants.length > 0) {
                existants.forEach(ex => {
                    let exStr = JSON.stringify(ex).replace(/"/g, '&quot;');
                    html += `<div onclick="ouvrirModalStockJson(${exStr})" style="cursor: pointer; background: #d4edda; border: 1px solid #c3e6cb; padding: 6px; border-radius: 4px; font-size: 12px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center;">
                        <div>📍 Site: <b>${ex.site}</b> | Bât: <b>${ex.batiment}</b> | Rang: <b>${ex.rang}</b></div>
                        <div style="background: #28a745; color: white; padding: 2px 6px; border-radius: 3px; font-weight: bold;">Qte: ${ex.quantite}</div>
                    </div>`;
                });
            } else {
                html += `<div style="font-size: 12px; color: #856404; font-style: italic;">Aucun stock enregistré pour ce symbole.</div>`;
            }
            html += `</div>`;
            divStock.innerHTML = html;
            document.getElementById('resultatJson').style.display = 'block';
        }

        /* ---------------------------------------------------- */
        /* Fonction 6 : Ouverture et fermeture de la modale SY  */
        /* ---------------------------------------------------- */
        function ouvrirModalStockJson(existant) {
            if (!articleJsonCourant) return;
            document.getElementById('modalTitreJson').textContent = existant ? "Modifier stock SY" : "Ajouter stock SY";
            document.getElementById('modalSousTitreJson').textContent = `SY : ${articleJsonCourant.symbole} | Plan : ${articleJsonCourant.plan}`;
            
            document.getElementById('stockSiteJson').value = existant ? existant.site : '';
            document.getElementById('stockBatimentJson').value = existant ? existant.batiment : '';
            document.getElementById('stockRangJson').value = existant ? existant.rang : '';
            document.getElementById('stockQuantiteJson').value = existant ? existant.quantite : '1';

            document.getElementById('modalOverlayJson').style.display = 'flex';
        }

        function fermerModalJson() {
            document.getElementById('modalOverlayJson').style.display = 'none';
        }

        /* ---------------------------------------------------- */
        /* Fonction 7 : Validation et sauvegarde du stock SY    */
        /* ---------------------------------------------------- */
        function validerMouvementStockJson() {
            if (!articleJsonCourant) return;
            let site = document.getElementById('stockSiteJson').value.trim();
            let batiment = document.getElementById('stockBatimentJson').value.trim();
            let rang = document.getElementById('stockRangJson').value.trim();
            let qte = parseInt(document.getElementById('stockQuantiteJson').value) || 0;

            if (!site || !batiment || !rang || qte <= 0) {
                alert("Veuillez remplir tous les champs correctement.");
                return;
            }

            let index = stockGlobal.findIndex(item =>
                String(item.plan || "").trim() === String(articleJsonCourant.plan || "").trim() &&
                String(item.symbole || "").trim().toLowerCase() === String(articleJsonCourant.symbole || "").trim().toLowerCase() &&
                String(item.site || "").toLowerCase() === site.toLowerCase() &&
                String(item.batiment || "").toLowerCase() === batiment.toLowerCase() &&
                String(item.rang || "").toLowerCase() === rang.toLowerCase()
            );

            if (index !== -1) {
                stockGlobal[index].quantite = qte;
            } else {
                stockGlobal.push({
                    plan: articleJsonCourant.plan,
                    rep: "000000",
                    symbole: articleJsonCourant.symbole,
                    intitule: articleJsonCourant.designation || articleJsonCourant.intitule || "",
                    site: site,
                    batiment: batiment,
                    rang: rang,
                    quantite: qte
                });
            }

            localStorage.setItem('stock_local_sauvegarde', JSON.stringify(stockGlobal));
            fermerModalJson();
            afficherFicheJson(articleJsonCourant);
            alert("✅ Stock SY mis à jour avec succès !");
        }
    </script>
</body>
</html>
