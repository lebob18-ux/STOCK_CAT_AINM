<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion de Stock - Terrain</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 10px; background-color: #f4f6f9; color: #333; 
        }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        h2 { font-size: 1.3rem; margin-top: 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h3 { font-size: 1.1rem; margin-bottom: 8px; color: #0056b3; }
        
        .search-section { margin-bottom: 15px; padding: 12px; background: #eef2f7; border-radius: 6px; position: relative; }
        label { font-weight: bold; display: block; margin-top: 8px; margin-bottom: 4px; font-size: 0.9rem; }
        
        input, select { padding: 12px; width: 100%; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
        
        button { 
            padding: 12px 15px; font-size: 16px; background: #0056b3; color: white; border: none; 
            border-radius: 6px; cursor: pointer; margin-top: 10px; width: 100%; font-weight: bold; 
        }
        button:active { background: #004085; }
        .btn-export { background: #28a745; width: auto; padding: 8px 12px; font-size: 0.9rem; margin-top: 0; }

        /* Suggestions et listes */
        #suggestions, #listePlanResultats {
            position: absolute; background: white; border: 1px solid #ccc; left: 0; right: 0;
            max-height: 320px; overflow-y: auto; z-index: 10; border-radius: 0 0 6px 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        #listePlanResultats { position: static; max-width: 100%; margin-top: 10px; border: none; box-shadow: none; background: transparent; }
        
        .suggestion-item { padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eee; background: white; }
        .suggestion-item:active { background: #e2e8f0; }
        
        /* Miniatures rectangulaires 320x240 adaptées en mode liste (ex: 120px x 90px) */
        .suggestion-item img { width: 120px; height: 90px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; flex-shrink: 0; }

        /* Zone Résultat / Fiche Article */
        #resultat { margin-top: 15px; padding: 12px; border: 1px solid #ddd; border-radius: 6px; display: none; background: #fff; }
        .result-flex { display: flex; gap: 15px; align-items: flex-start; flex-direction: row; }
        
        /* Grande image rectangulaire 320x240 pour la fiche */
        .result-flex img { width: 160px; height: 120px; object-fit: cover; border: 1px solid #ccc; border-radius: 6px; flex-shrink: 0; }
        
        .result-infos { font-size: 0.9rem; word-break: break-word; }
        .result-infos p { margin: 4px 0; }

        /* Popup Modal */
        #modalExistant { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { margin-top: 0; }

        @media (max-width: 450px) {
            .result-flex { flex-direction: column; align-items: center; text-align: center; }
            .result-flex img { width: 200px; height: 150px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>
        <span>Stock AINM</span>


<!-- Nouveau bouton d'envoi partage -->
<button onclick="partagerStock()">Partager le stock</button>
    </h2>

    <!-- Recherche par Plan -->
    <div class="search-section">
        <h3>1. Recherche par Plan</h3>
        <label>N° de Plan (6 chiffres) :</label>
        <div style="display: flex; gap: 8px;">
            <input type="tel" id="inputPlan" placeholder="Ex: 123456" style="flex: 1;">
            <button onclick="rechercherParPlan()" style="margin-top:0; width: auto; padding: 12px 18px;">OK</button>
        </div>
        <div id="listePlanResultats"></div>
    </div>

    <!-- Recherche par Symbole -->
    <div class="search-section" style="position: relative;">
        <h3>2. Recherche par Symbole</h3>
        <label>Symbole (Tapez dès le 5e chiffre) :</label>
        <input type="tel" id="inputSymbole" placeholder="Ex: 08804001" autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <!-- Fiche Article & Localisation -->
    <div id="resultat">
        <h3>Fiche Pièce</h3>
        <div class="result-flex">
            <img id="imgPiece" src="" alt="Miniature">
            <div class="result-infos">
                <p><strong>Plan :</strong> <span id="resPlan"></span></p>
                <p><strong>REP :</strong> <span id="resRep"></span></p>
                <p><strong>Symb :</strong> <span id="resSymbole"></span></p>
                <p><strong style="color: #0056b3;"><span id="resIntitule"></span></strong></p>
            </div>
        </div>

        <div id="infoStockActuel" style="margin-top: 15px; padding: 12px; border-radius: 6px; display: none; font-size: 0.95rem;"></div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

        <h3 style="margin-top: 0;">Emplacement de stockage</h3>
        <label>Site :</label>
        <input type="text" id="stockSite" placeholder="Ex: Dépôt Paris">
        
        <label>Bâtiment :</label>
        <input type="text" id="stockBatiment" placeholder="Ex: Hall B">
        
        <label>Rang :</label>
        <input type="text" id="stockRang" placeholder="Ex: Étagère 4">
        
        <label>Quantité :</label>
        <input type="number" id="stockQuantite" value="1" min="1" pattern="[0-9]*">
        
        <button onclick="validerStockage()" style="background: #28a745; margin-top: 15px;">Enregistrer</button>
    </div>
</div>

<!-- Modal Doublon -->
<div id="modalExistant">
    <div class="modal-content">
        <h3>Pièce déjà référencée !</h3>
        <p id="modalTexteInfo" style="font-size: 0.95rem; line-height: 1.4;"></p>
        <div class="modal-buttons">
            <button onclick="fusionnerQuantite()" style="background: #28a745;">Ajouter (+)</button>
            <button onclick="forcerNouvelEmplacement()" style="background: #dc3545;">Ailleurs</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
